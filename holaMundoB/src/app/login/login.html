<p></p>
<div class="container">
<form [formGroup]="formulario" (ngSubmit)="login()">
    <div class="mb-3 row">
        <label class="col-sm-2 col-form-label">Email:</label>
        <div class="col-sm-10">
            <input type="email" class="form-control" formControlName="email">
            @if(formulario.get('email')?.invalid 
    && formulario.get('email')?.touched){
        <div class="colorRojo"> El email es obligatorio</div>
    }
        </div>
        
        
    </div>
    
    
     <div class="mb-3 row">
        <label class="col-sm-2 col-form-label">Password:</label>
        <div class="col-sm-10">
            <input type="password" class="form-control" formControlName="password">
            @if(formulario.get('password')?.invalid 
    && formulario.get('password')?.touched){
        <div class="colorRojo"> El password es obligatorio</div>
    }
        </div>
    
    
     </div>
     

    
    <button type = "submit" class="btn btn-primary float-end">Ingresar</button>

</form>
</div>
